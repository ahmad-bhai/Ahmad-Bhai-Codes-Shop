<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUY SCRIPTS - AHMAD BHAI</title>
    <style>
        :root {
            --bg-color: #1c242a;
            --accent-color: #5C13C3;
            --card-border: rgba(255, 255, 255, 0.3);
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Lucida Sans', sans-serif; }
        
        body { 
            background: var(--bg-color); 
            color: white; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.5s;
        }

        /* Menu Open Effect */
        body.menu-open #main-content {
            filter: blur(10px) brightness(0.5);
            pointer-events: none;
        }

        /* --- Fixed Header (Menu Button) --- */
        header { 
            position: fixed; 
            top: 0; 
            right: 0;
            width: 100%; 
            padding: 15px 25px; 
            display: flex; 
            justify-content: flex-end; 
            z-index: 2000; 
            pointer-events: none; 
        }
        
        .hamburger { cursor: pointer; pointer-events: auto; }
        .hamburger input { display: none; }
        .hamburger svg { height: 3em; transition: 600ms; }
        .line { fill: none; stroke: white; stroke-linecap: round; stroke-width: 3; transition: 600ms; }
        .line-top-bottom { stroke-dasharray: 12 63; }
        .hamburger input:checked + svg { transform: rotate(-45deg); }
        .hamburger input:checked + svg .line-top-bottom { stroke-dasharray: 20 300; stroke-dashoffset: -32.42; }

        /* --- Sidebar Menu --- */
        .menu-container {
            position: fixed; top: 0; right: -100%; width: 280px; height: 100vh;
            background: rgba(28, 36, 42, 0.98); border-left: 3px solid var(--accent-color);
            padding: 100px 15px 20px; transition: 0.5s; z-index: 1500;
        }
        .menu-container.active { right: 0; }
        .nav-item {
            background: rgba(255, 255, 255, 0.05); padding: 12px; display: flex;
            align-items: center; gap: 15px; color: #7D8590; text-decoration: none;
            font-size: 14px; font-weight: bold; border-radius: 12px; margin-bottom: 10px; transition: 0.3s;
        }
        .nav-item:hover { background: rgba(92, 19, 195, 0.25); color: white; transform: translateX(-5px); }
        .nav-icon { width: 22px; height: 22px; object-fit: contain; }

        /* --- Content Layout --- */
        #main-content { width: 100%; display: flex; flex-direction: column; align-items: center; padding-top: 70px; }

        .title { 
            background: rgba(255,255,255,0.1); 
            color: white; 
            font-size: 26px; 
            text-align: center; 
            padding: 1rem; 
            border-radius: 10px; 
            margin: 1rem auto; 
            width: fit-content; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 1px solid var(--card-border);
        }

        .logo-animate { 
            width: 130px; 
            height: 130px;
            animation: float 2s ease-in-out infinite; 
            margin: 15px auto; 
            display: block; 
            border-radius: 50%; 
            border: 5px solid var(--accent-color); 
            object-fit: cover;
            box-shadow: 0 0 15px var(--accent-color);
        }
        @keyframes float { 0%{transform:scale(1);} 50%{transform:scale(1.1);} 100%{transform:scale(1);} }

        /* --- Payment Card Box --- */
        .payment-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 30px 20px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-top: 20px;
            line-height: 1.6;
        }

        .payment-text {
            font-size: 18px;
            font-weight: bold;
            color: #e0e0e0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .highlight-id {
            color: #00ff00;
            font-size: 22px;
            display: block;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        .link-style {
            color: var(--accent-color);
            text-decoration: none;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 2px;
            transition: 0.3s;
        }

        .link-style:hover {
            color: white;
            border-color: white;
        }

        .footer-text { margin: 50px 0; font-size: 0.9rem; font-weight: bold; opacity: 0.8; }

    </style>
</head>
<body>

    <header>
        <label class="hamburger">
            <input type="checkbox" id="menu-toggle">
            <svg viewBox="0 0 32 32">
                <path class="line line-top-bottom" d="M27 10 13 10C10.8 10 9 8.2 9 6 9 3.5 10.8 2 13 2 15.2 2 17 3.8 17 6L17 26C17 28.2 18.8 30 21 30 23.2 30 25 28.2 25 26 25 23.8 23.2 22 21 22L7 22"></path>
                <path class="line" d="M7 16 27 16"></path>
            </svg>
        </label>
    </header>

    <nav class="menu-container" id="side-menu">
        <a href="index.html" class="nav-item"><img src="dashboard.png" class="nav-icon"> DASHBOARD</a>
        <a href="quotex-scripts-prices.html" class="nav-item"><img src="price.png" class="nav-icon"> QUOTEX SCRIPTS PRICES</a>
        <a href="contact.html" class="nav-item"><img src="contact.png" class="nav-icon"> CONTACT</a>
        <a href="buy-quotex-script.html" class="nav-item"><img src="buy-scripts.png" class="nav-icon"> BUY QUOTEX SCRIPTS</a>
        <a href="how-to-use.html" class="nav-item"><img src="use.png" class="nav-icon"> HOW TO USE</a>
        <a href="rules-info.html" class="nav-item"><img src="rules.png" class="nav-icon"> SCRIPTS RULE & INFO</a>
    </nav>

    <div id="main-content">
        <div class="title">BUY QUOTEX SCRIPTS</div>
        
        <img src="logo.png" class="logo-animate">

        <div class="payment-card">
            <p class="payment-text">
                PAY $30 ON BINANCE ID <br>
                <span class="highlight-id">505638805</span>
                <span class="highlight-id">AHMAD_BHAI_786</span>
                AND SEND PAYMENT PROOF <a href="contact.html" class="link-style">HERE</a> AND 
                <a href="contact.html" class="link-style">CONTACT</a> TO UNLOCK ALL SCRIPTS
            </p>
        </div>

        <div class="footer-text">® Registered with Ahmad Bhai</div>
    </div>

    <script>
        const toggleBtn = document.getElementById('menu-toggle');
        const sideMenu = document.getElementById('side-menu');
        const body = document.body;

        toggleBtn.addEventListener('change', function() {
            if(this.checked) {
                sideMenu.classList.add('active');
                body.classList.add('menu-open');
            } else {
                sideMenu.classList.remove('active');
                body.classList.remove('menu-open');
            }
        });
    </script>
</body>
</html>
