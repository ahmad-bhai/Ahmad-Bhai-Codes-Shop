<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<style>
body { background:#1c242a; color:white; font-family:Arial; text-align:center; padding-top:50px; }
input[type="password"] { padding:10px; font-size:16px; width:200px; margin:10px; }
button { padding:10px 20px; font-size:16px; cursor:pointer; }
.switch { position: relative; display: inline-block; width:60px; height:34px; margin-top:20px; }
.switch input { opacity:0; width:0; height:0; }
.slider { position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background:#ccc; transition:.4s; border-radius:34px; }
.slider:before { position:absolute; content:""; height:26px; width:26px; left:4px; bottom:4px; background:white; transition:.4s; border-radius:50%; }
input:checked + .slider { background:green; }
input:checked + .slider:before { transform:translateX(26px); }
</style>
</head>
<body>

<h2>Admin Login</h2>
<input type="password" id="pass" placeholder="Enter Password">
<button id="loginBtn">Login</button>

<div id="adminPanel" style="display:none;">
  <h2>Maintenance Mode</h2>
  <label class="switch">
    <input type="checkbox" id="toggleMaintenance">
    <span class="slider"></span>
  </label>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB5RMsZqPR_K15GvOsKHLKPmRYKYTzzVvc",
  authDomain: "system-d7401.firebaseapp.com",
  databaseURL: "https://system-d7401-default-rtdb.firebaseio.com",
  projectId: "system-d7401",
  storageBucket: "system-d7401.firebasestorage.app",
  messagingSenderId: "1012850905689",
  appId: "1:1012850905689:web:4cb43cb6d136ccb98a1748"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const maintenanceRef = ref(db, "maintenance/status");

const loginBtn = document.getElementById("loginBtn");
loginBtn.addEventListener("click", () => {
  const pass = document.getElementById("pass").value;
  if(pass === "181314"){
    document.getElementById("adminPanel").style.display = "block";
  } else {
    alert("Wrong password!");
  }
});

const toggle = document.getElementById("toggleMaintenance");

onValue(maintenanceRef, (snap) => {
  toggle.checked = snap.val();
});

toggle.addEventListener("change", () => {
  set(maintenanceRef, toggle.checked);
});
</script>

</body>
</html>
