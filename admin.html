<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | AHMAD BHAI CODES SHOP</title>

<style>
body{
  background:#1c242a;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:25px;
}
input{
  padding:8px;
  width:100%;
  margin-top:5px;
  border-radius:6px;
  border:none;
}
button{
  padding:8px 18px;
  cursor:pointer;
  margin-top:10px;
  border-radius:6px;
  border:none;
}
.box{
  border:1px solid #444;
  padding:14px;
  margin:14px auto;
  max-width:360px;
  border-radius:12px;
  text-align:left;
}
.small{
  font-size:12px;
  color:#aaa;
  margin-bottom:6px;
}
.msg{
  margin-top:8px;
  font-size:13px;
  color:#4caf50;
  display:none;
}
.toggle{
  margin-top:8px;
}
</style>
</head>

<body>

<h2>Admin Login</h2>
<input type="password" id="pass" placeholder="Admin password">
<button id="loginBtn">Login</button>

<p id="loginMsg" class="msg"></p>

<div id="adminPanel" style="display:none;">

<h2>Maintenance Mode</h2>
<label class="toggle">
<input type="checkbox" id="toggleMaintenance"> Website Maintenance ON
</label>

<hr style="margin:25px 0;">

<h2>Products Control</h2>
<div id="scripts"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
 apiKey:"AIzaSyB5RMsZqPR_K15GvOsKHLKPmRYKYTzzVvc",
 authDomain:"system-d7401.firebaseapp.com",
 databaseURL:"https://system-d7401-default-rtdb.firebaseio.com",
 projectId:"system-d7401",
 storageBucket:"system-d7401.firebasestorage.app",
 messagingSenderId:"1012850905689",
 appId:"1:1012850905689:web:4cb43cb6d136ccb98a1748"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* LOGIN */
loginBtn.onclick = ()=>{
 if(pass.value==="181314"){
  adminPanel.style.display="block";
  loginMsg.style.display="block";
  loginMsg.textContent="Login successful";
 }else{
  loginMsg.style.display="block";
  loginMsg.style.color="#ff5252";
  loginMsg.textContent="Wrong password";
 }
};

/* MAINTENANCE */
const maintenanceRef = ref(db,"maintenance/status");
onValue(maintenanceRef,s=>{
 toggleMaintenance.checked = s.val()===true;
});
toggleMaintenance.onchange=()=>{
 set(maintenanceRef,toggleMaintenance.checked);
};

/* PRODUCTS */
const names={
 s1:"QX LIVE CODE",
 s2:"ANDROID FEEDBACKS",
 s3:"IPHONE FEEDBACKS",
 s4:"QX PARTNER BOT SS",
 s5:"QX WITHDRAWAL EMAIL SS",
 s6:"BINANCE PAY EMAIL SS",
 s7:"QX SIGNALS ROBOT | MODEL 1",
 s8:"QX SIGNALS ROBOT | MODEL 2"
};

const scriptsDiv=document.getElementById("scripts");

Object.keys(names).forEach(id=>{
 const r=ref(db,"scripts/"+id);

 onValue(r,snap=>{
  if(!snap.exists()){
   set(r,{price:"",link:""});
   return;
  }
  const d=snap.val();

  let box=document.getElementById("box_"+id);
  if(box) box.remove();

  box=document.createElement("div");
  box.className="box";
  box.id="box_"+id;

  box.innerHTML=`
   <b>${names[id]}</b>

   <div class="small">Enter Price</div>
   <input id="p_${id}" value="${d.price||""}">

   <div class="small">Enter Url</div>
   <input id="l_${id}" value="${d.link||""}">

   <button onclick="save('${id}')">UPDATE</button>
   <div id="m_${id}" class="msg">Updated successfully </div>
  `;
  scriptsDiv.appendChild(box);
 });
});

window.save=(id)=>{
 set(ref(db,"scripts/"+id),{
  price:document.getElementById("p_"+id).value,
  link:document.getElementById("l_"+id).value
 });
 const m=document.getElementById("m_"+id);
 m.style.display="block";
 setTimeout(()=>m.style.display="none",2000);
}
</script>

</body>
</html>
