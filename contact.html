<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHMAD BHAI CONTACT</title>
    <style>
        :root {
            --bg-color: #1c242a;
            --accent-color: #5C13C3;
            --card-border: rgba(255, 255, 255, 0.3);
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Lucida Sans', sans-serif; }
        
        body { 
            background: var(--bg-color); 
            color: white; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.5s;
        }

        /* Menu Open Effect */
        body.menu-open #main-content {
            filter: blur(10px) brightness(0.5);
            pointer-events: none;
        }

        /* --- Fixed Header (Button Hamesha Upar Rahega) --- */
        header { 
            position: fixed; 
            top: 0; 
            right: 0;
            width: 100%; 
            padding: 15px 25px; 
            display: flex; 
            justify-content: flex-end; 
            z-index: 2000; /* Isko sabse upar rakha hai */
            pointer-events: none; /* Taake niche ke elements click ho saken */
        }
        
        .hamburger { 
            cursor: pointer; 
            pointer-events: auto; /* Sirf button click ho sake */
        }
        
        .hamburger input { display: none; }
        .hamburger svg { height: 3em; transition: 600ms; }
        .line { fill: none; stroke: white; stroke-linecap: round; stroke-width: 3; transition: 600ms; }
        .line-top-bottom { stroke-dasharray: 12 63; }
        .hamburger input:checked + svg { transform: rotate(-45deg); }
        .hamburger input:checked + svg .line-top-bottom { stroke-dasharray: 20 300; stroke-dashoffset: -32.42; }

        /* --- Sidebar Menu --- */
        .menu-container {
            position: fixed; top: 0; right: -100%; width: 280px; height: 100vh;
            background: rgba(28, 36, 42, 0.98); border-left: 3px solid var(--accent-color);
            padding: 100px 15px 20px; transition: 0.5s; z-index: 1500;
        }
        .menu-container.active { right: 0; }
        .nav-item {
            background: rgba(255, 255, 255, 0.05); padding: 12px; display: flex;
            align-items: center; gap: 15px; color: #7D8590; text-decoration: none;
            font-size: 14px; font-weight: bold; border-radius: 12px; margin-bottom: 10px; transition: 0.3s;
        }
        .nav-item:hover { background: rgba(92, 19, 195, 0.25); color: white; transform: translateX(-5px); }
        .nav-icon { width: 22px; height: 22px; object-fit: contain; }

        /* --- Content Layout --- */
        #main-content { width: 100%; display: flex; flex-direction: column; align-items: center; padding-top: 70px; }

        .title { 
            background: rgba(255,255,255,0.1); 
            color: white; 
            font-size: 26px; 
            text-align: center; 
            padding: 1rem; 
            border-radius: 10px; 
            margin: 1rem auto; 
            width: fit-content; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 1px solid var(--card-border);
        }

        .logo-animate { 
            width: 130px; 
            height: 130px;
            animation: float 2s ease-in-out infinite; 
            margin: 15px auto; 
            display: block; 
            border-radius: 50%; 
            border: 5px solid var(--accent-color); 
            object-fit: cover;
            box-shadow: 0 0 15px var(--accent-color);
        }
        @keyframes float { 0%{transform:scale(1);} 50%{transform:scale(1.1);} 100%{transform:scale(1);} }

        .contact-container { display: flex; flex-direction: column; gap: 20px; width: 90%; max-width: 400px; margin-top: 10px; }

        .contact-card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(5px);
        }

        .contact-logo { width: 80px; height: 80px; object-fit: contain; }
        .contact-label { font-weight: bold; font-size: 14px; letter-spacing: 1px; color: #ccc; }

        /* --- Animated Buttons --- */
        .Btn {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition-duration: 0.3s;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
        }

        .tg-btn { background-color: #24a1de; }
        .wa-btn { background-color: #00d757; }

        .sign { width: 100%; display: flex; align-items: center; justify-content: center; transition-duration: 0.3s; }
        .sign svg { width: 25px; fill: white; }

        .text {
            position: absolute; right: 0%; width: 0%; opacity: 0; color: white;
            font-size: 1.1em; font-weight: 600; transition-duration: 0.3s;
        }

        .Btn:hover { width: 150px; border-radius: 40px; }
        .Btn:hover .sign { width: 30%; padding-left: 10px; }
        .Btn:hover .text { opacity: 1; width: 70%; padding-right: 10px; }
        .Btn:active { transform: translate(2px, 2px); }

        .footer-text { margin: 40px 0; font-size: 0.9rem; font-weight: bold; opacity: 0.8; }

    </style>
</head>

    <script>
        const toggleBtn = document.getElementById('menu-toggle');
        const sideMenu = document.getElementById('side-menu');
        const body = document.body;

        toggleBtn.addEventListener('change', function() {
            if(this.checked) {
                sideMenu.classList.add('active');
                body.classList.add('menu-open');
            } else {
                sideMenu.classList.remove('active');
                body.classList.remove('menu-open');
            }
        });
    </script>
