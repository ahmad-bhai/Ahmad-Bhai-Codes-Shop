<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHMAD BHAI ADMIN PANEL</title>
   <link rel="icon" href="https://i.ibb.co/Z69FyZ04/20251103-091451.png" type="image/png" />
    <style>
        /* Theme Logic: Inverted for Mobile Settings */
        :root {
            --bg-color: #000000; /* Light Mode: Black BG */
            --text-color: #ffffff; /* Light Mode: White Text */
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #ffffff; /* Dark Mode: White BG */
                --text-color: #000000; /* Dark Mode: Black Text */
            }
        }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* System Default Fonts */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            user-select: text;
            -webkit-user-select: text;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0;
            font-weight: 600;
        }

        .info-section {
            margin-top: 10px;
            font-size: 1rem;
            opacity: 0.9;
        }

        .domain-link {
            display: block;
            margin-top: 5px;
            cursor: text; /* Link ka hath (pointer) nahi banega */
            -webkit-tap-highlight-color: transparent; /* Mobile click effect remove */
        }
    </style>
</head>
<body>

    <h1>Not found</h1>

    <div class="info-section">
        <span>Website change with
        </span>
        
        <div class="domain-link" onclick="openPanel()">
            Domain: ahmad-bhai-admin-panel
        </div>
    </div>

    <script>
        function openPanel() {
            // New tab mein open karne ke liye
            window.open("https://ahmad-bhai-admin-panel.vercel.app/", "_blank");
        }

        // Local Storage Maintenance (Instructions Followed)
        window.onload = function() {
            if (localStorage.getItem('togglePosition') === null) {
                localStorage.setItem('togglePosition', 'on');
            }
        };
    </script>
</body>
</html>
