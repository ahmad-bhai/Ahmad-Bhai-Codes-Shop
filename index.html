<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHMAD BHAI CODES SITE</title>
    <style>
        :root {
            --bg-color: #1c242a;
            --accent-color: #5C13C3;
            --menu-bg: rgba(28, 36, 42, 0.98);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-top: 60px;
            overflow-x: hidden;
            transition: background 0.5s;
        }

        /* Menu Khulne par Content Blur aur Blue filter */
        body.menu-open #main-content {
            filter: blur(8px) brightness(0.6);
            pointer-events: none;
            background-color: rgba(0, 50, 150, 0.2);
        }

        /* --- Header --- */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 15px 25px;
            display: flex;
            justify-content: flex-end;
            z-index: 1001;
        }

        /* Hamburger Styles */
        .hamburger { cursor: pointer; }
        .hamburger input { display: none; }
        .hamburger svg { height: 3em; transition: transform 600ms cubic-bezier(0.4, 0, 0.2, 1); }
        .line { fill: none; stroke: white; stroke-linecap: round; stroke-linejoin: round; stroke-width: 3; transition: 600ms; }
        .line-top-bottom { stroke-dasharray: 12 63; }
        .hamburger input:checked + svg { transform: rotate(-45deg); }
        .hamburger input:checked + svg .line-top-bottom { stroke-dasharray: 20 300; stroke-dashoffset: -32.42; }

        /* --- Sidebar Menu --- */
        .menu-container {
            position: fixed;
            top: 0;
            right: -100%;
            width: 280px;
            height: 100vh;
            background: var(--menu-bg);
            border-left: 3px solid var(--accent-color);
            padding: 100px 15px 20px 15px;
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }

        .menu-container.active {
            right: 0;
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: #7D8590;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            border-radius: 12px;
            transition: 0.3s;
        }

        .nav-item:hover {
            background: rgba(92, 19, 195, 0.25);
            color: white;
            transform: translateX(-5px);
        }

        /* PNG Icon Style */
        .nav-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        /* --- Main UI Elements --- */
        #main-content {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.5s ease;
        }

        .logo-box {
            margin-top: 30px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid var(--accent-color);
            padding: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            animation: zoomInOut 4s infinite ease-in-out;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        @keyframes zoomInOut {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .container {
            width: 90%;
            max-width: 450px;
            margin-top: 40px;
            text-align: center;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            backdrop-filter: blur(5px);
        }

        .card h1 { font-size: 1.3rem; letter-spacing: 1px; color: white; }
        .card p { font-size: 0.95rem; line-height: 1.6; color: #f0f0f0; }

        .footer-text { margin-top: 15px; font-weight: 600; opacity: 0.7; font-size: 0.9rem; }

    </style>
</head>
<body>

    <header>
        <label class="hamburger">
            <input type="checkbox" id="menu-toggle-btn">
            <svg viewBox="0 0 32 32">
                <path class="line line-top-bottom" d="M27 10 13 10C10.8 10 9 8.2 9 6 9 3.5 10.8 2 13 2 15.2 2 17 3.8 17 6L17 26C17 28.2 18.8 30 21 30 23.2 30 25 28.2 25 26 25 23.8 23.2 22 21 22L7 22"></path>
                <path class="line" d="M7 16 27 16"></path>
            </svg>
        </label>
    </header>

    <nav class="menu-container" id="side-menu">
        <div class="nav-links">
            <a href="index.html" class="nav-item">
                <img src="dashboard.png" class="nav-icon" alt="Dashboard"> DASHBOARD
            </a>
            <a href="quotex-scripts-prices.html" class="nav-item">
                <img src="price.png" class="nav-icon" alt="Price"> QUOTEX SCRIPTS PRICES
            </a>
            <a href="contact.html" class="nav-item">
                <img src="contact.png" class="nav-icon" alt="Contact"> CONTACT
            </a>
            <a href="buy-quotex-script.html" class="nav-item">
                <img src="buy-scripts.png" class="nav-icon" alt="Buy"> BUY QUOTEX SCRIPTS
            </a>
            <a href="how-to-use.html" class="nav-item">
                <img src="use.png" class="nav-icon" alt="Use"> HOW TO USE
            </a>
            <a href="rules-info.html" class="nav-item">
                <img src="rules.png" class="nav-icon" alt="Rules"> SCRIPTS RULE & INFO
            </a>
        </div>
    </nav>

    <div id="main-content">
        <div class="logo-box">
            <img src="logo.png" alt="Logo">
        </div>

        <div class="container">
            <div class="card">
                <h1>AHMAD BHAI CODES SITE</h1>
            </div>

            <div class="card">
                <p>This website is for selling Scripts and Robots, You can also create or buy script, robots and more websites from it.</p>
            </div>

            <p class="footer-text">® Registered with Ahmad Bhai</p>
        </div>
    </div>

    <script>
        const toggleBtn = document.getElementById('menu-toggle-btn');
        const sideMenu = document.getElementById('side-menu');
        const body = document.body;

        toggleBtn.addEventListener('change', function() {
            if(this.checked) {
                sideMenu.classList.add('active');
                body.classList.add('menu-open');
            } else {
                sideMenu.classList.remove('active');
                body.classList.remove('menu-open');
            }
        });

        // Click outside to close (Optional but better UX)
        document.addEventListener('click', function(event) {
            if (body.classList.contains('menu-open') && 
                !sideMenu.contains(event.target) && 
                !toggleBtn.parentElement.contains(event.target)) {
                toggleBtn.checked = false;
                sideMenu.classList.remove('active');
                body.classList.remove('menu-open');
            }
        });
    </script>
</body>
</html>
