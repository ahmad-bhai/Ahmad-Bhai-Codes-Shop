<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Maintenance</title>
<style>
body {
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:#1c242a;
  color:white;
  text-align:center;
  font-family:Arial, sans-serif;
}
img {
  width:120px;
  animation: float 2s ease-in-out infinite;
}
@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-15px); }
  100% { transform: translateY(0px); }
}
h1 { font-size:28px; margin-top:20px; font-weight:bold; }
p { opacity:0.8; max-width:300px; }
</style>
</head>
<body>
<img src="Ahmad.png">
<h1>Under maintenance</h1>
<p>We will be as soon as possible.<br>Please check again in a little while.</p>
</body>
</html>
